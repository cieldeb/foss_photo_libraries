<script>
  function toggleWidth() {
    if (document.querySelector("div.container-lg").style["max-width"]) {
      document.querySelector("div.container-lg").style.maxWidth = null;
      document.querySelector("button[name='toggle-table-width']").textContent = "Expand table";
    } else {
      document.querySelector("div.container-lg").style.maxWidth = "100%";
      document.querySelector("button[name='toggle-table-width']").textContent = "Collapse table";
    }
  }

  function updateVisibility() {
  const all = document.querySelector('#allCheckbox');
  const showAll = all && all.checked;

  document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    if (checkbox === all || !checkbox.id) return;

    const visible = showAll || checkbox.checked;
    document.querySelectorAll(`.${CSS.escape(checkbox.id)}`).forEach(element => {
      element.style.display = visible ? '' : 'none';
    });
  });
}

function onCheckboxChange(event) {
  const all = document.querySelector('#allCheckbox');
  const changed = event.target;

  if (all && changed !== all && all.checked) {
    // Leaving "All" mode: keep the current state by checking every project box,
    // then apply the user's click (which was already toggled by the browser).
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      if (cb !== all && cb !== changed) cb.checked = true;
    });
    all.checked = false;
  }

    updateVisibility();
}

  document.addEventListener("DOMContentLoaded", function(event) {
    var el = document.querySelector('table');
    var wrapper = document.createElement('div');
    wrapper.setAttribute("class", "table-wrapper");
    el.parentNode.insertBefore(wrapper, el);
    wrapper.appendChild(el);
    wrapper.insertAdjacentHTML( 'beforebegin', '<button name="toggle-table-width" onclick="toggleWidth()">Expand table</button>' );

    // Clickable checkboxes
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(checkbox => {
      checkbox.removeAttribute('disabled');   // kramdown adds this
      checkbox.addEventListener('change', onCheckboxChange);
    });

    // Adds IDs to cells for visibility toggling
    document.querySelectorAll('td [id], th [id]').forEach(el => {
      const cell = el.closest('td, th');
      if (!cell || cell.id) return;
      cell.id = el.id;

      if (el.tagName === 'SPAN') {
        el.replaceWith(...el.childNodes);
      } else {
        el.removeAttribute('id');
      }
    });

    updateVisibility();
  });
</script>
